<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script src='jquery-3.3.1.min.js'></script>
    <link rel="stylesheet" href="app.css">
    <script async src="app.js"></script>
    <title>TCSDG - SR Telemetry</title>
  </head>
  <body>
    <header>
      <h1>TCSDG - SR Telemetry</h1>
    </header>

    <div id="Sensor">
      <h2>Sensor Readings</h2>
      <label for="pack_voltage_value">Pack Voltage: </label>
      <div id="pack_voltage_value"></div>
      <label>V</label><br>

      <label for="motor_speed_value">Motor Speed: </label>
      <div id="motor_speed_value"></div>
      <label>RPM</label><br>

      <label for="vcu_faults_value">VCU Faults: </label>
      <div id="vcu_faults_value"></div>
      <label>Faults</label><br>

      <label for="bms_faults_value">BMS Faults: </label>
      <div id="bms_faults_value"></div>
      <label>Faults</label><br>
    </div>
    <hr>

    <div id="OTA">
      <h2>ESP32 Firmware Update</h2>
      <label id="latest_firmware_label">Latest Firmware: </label>
      <div id="latest_firmware"></div> 
      <input type="file" id="selected_file" accept=".bin" style="display: none;" onchange="getFileInfo()" />
      <div class="buttons">
        <input type="button" value="Select File" onclick="document.getElementById('selected_file').click();" />
        <input type="button" value="Update Firmware" onclick="updateFirmware()" />
      </div>
      <h4 id="file_info"></h4>
      <h4 id="ota_update_status"></h4>
    </div>
    <hr>

  </body>
</html>
